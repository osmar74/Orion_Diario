<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      {% block title %}
        Orion Procesos
      {% endblock %}
    </title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/deepblack.css') }}" />
  </head>
  <body>
    {% include 'partials/header.html' %}

    <div class="main-layout">
      {% block sidebar %}
        {% include 'partials/sidebar.html' %}
      {% endblock %}

      

      {% block content %}
        {% include 'partials/monitor.html' %}
      {% endblock %}
    </div>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script src="{{ url_for('static', filename='js/orion.js') }}"></script>
    <script src="{{ url_for('static', filename='js/aster.js') }}"></script>
    <script src="{{ url_for('static', filename='js/consolidado.js') }}"></script>
    <script>
      function toggleSidebar() {
        const sidebar = document.getElementById('sidebar')
        sidebar.classList.toggle('collapsed')
      }
    </script>
  </body>
</html>
