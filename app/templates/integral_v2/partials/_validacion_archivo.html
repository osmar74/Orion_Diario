<section class="iv2-card"><div class="iv2-card-title">Validación de archivo</div>{% if resultado.ok %}<p>Total: {{ resultado.total_registros }}</p><table class="iv2-table"><tbody>{% for e in resultado.entidades %}<tr><td>{{ e.entidad }}</td><td>{{ e.registros }}</td><td>{{ 'Sí' if e.seleccionada else 'No' }}</td></tr>{% endfor %}</tbody></table>{% else %}<div class="iv2-alert iv2-alert-danger">{{ resultado.mensaje }}</div>{% endif %}</section>
