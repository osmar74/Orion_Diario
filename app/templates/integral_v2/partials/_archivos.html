<section class="iv2-card"><div class="iv2-card-title">Archivos encontrados</div>{% include "integral_v2/partials/_pasos.html" %}{% if archivos %}<table class="iv2-table"><tbody>{% for a in archivos %}<tr><td>{% if a.ok %}<button type="button" class="iv2-usar-archivo" data-ruta="{{ a.ruta }}">Usar</button>{% endif %}</td><td>{{ a.ruta or a.ruta_base }}</td><td>{{ a.mensaje or a.tipo_detectado or '' }}</td></tr>{% endfor %}</tbody></table>{% else %}<div class="iv2-alert iv2-alert-warning">No se encontraron archivos.</div>{% endif %}</section>
