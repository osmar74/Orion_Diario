<section class="integral-v2-card">
    <div class="integral-v2-section-header">
        <h3>Validación y ejecución Integral</h3>
        <p>Primero valide conteos. Luego ejecute la carga solo cuando esté seguro de la conexión seleccionada.</p>
    </div>

    <form id="integral-v2-validar-form" action="/accion/integral-v2/validar" method="post" class="integral-v2-form">
        <label>
            Conexión
            <select name="conexion" id="integral-v2-conexion">
                <option value="local" selected>LOCAL - Pruebas</option>
                <option value="remoto">REMOTO - Producción</option>
            </select>
        </label>

        <label>
            Fecha proceso
            <input name="fecha" id="integral-v2-fecha" type="text" value="20260518" placeholder="YYYYMMDD o YYYY-MM-DD">
        </label>

        <label>
            Entidad
            <input name="entidad" id="integral-v2-entidad" type="text" value="Manual_Base_Churn_18052026" placeholder="Manual_Base_Churn_18052026">
        </label>

        <label class="integral-v2-check">
            <input type="checkbox" name="confirmar_ejecucion" value="1">
            Confirmo ejecutar carga
        </label>

        <button type="submit" class="integral-v2-btn secondary" data-integral-v2-action="/accion/integral-v2/validar">
            Validar conteos
        </button>

        <button type="submit" class="integral-v2-btn primary" data-integral-v2-action="/accion/integral-v2/ejecutar">
            Ejecutar pipeline Integral
        </button>
    </form>
</section>
