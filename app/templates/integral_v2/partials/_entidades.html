<section class="iv2-card"><div class="iv2-card-title">Entidades encontradas</div>{% include "integral_v2/partials/_pasos.html" %}{% if entidades %}<table class="iv2-table"><thead><tr><th>Seleccionar</th><th>Entidad</th><th>Registros</th></tr></thead><tbody>{% for e in entidades %}<tr><td><input type="checkbox" class="iv2-entidad-check" value="{{ e.entidad }}"></td><td>{{ e.entidad }}</td><td>{{ e.registros }}</td></tr>{% endfor %}</tbody></table><button type="button" id="iv2-usar-entidades">Usar entidades seleccionadas</button>{% else %}<div class="iv2-alert iv2-alert-warning">No se encontraron entidades.</div>{% endif %}</section>
