<template id="tpl-monitor-aster">
<div class="log-line info" class="ui-section-info">
            Módulo para gestionar el proceso diario ASTER: captura del total, búsqueda del archivo After, normalización, conciliación de entidades e inserción final.
        </div>

        <details class="panel-monitor aster-fase-a-panel" open>
    <summary>
        <span class="panel-icon">📱</span>
        FASE A. Captura del total diario ASTER
    </summary>

    <div class="panel-body">
        <div class="aster-fase-a-grid">
            <section class="aster-step-card">
                <div class="aster-step-header">
                    <span class="aster-step-number">1</span>
                    <div>
                        <h4>Captura por OCR WhatsApp</h4>
                        <p>Seleccione una imagen del reporte y reconozca el total.</p>
                    </div>
                </div>

                <div class="aster-file-picker-row">
                    <input
                        id="asterOcrFiles"
                        type="file"
                        accept="image/*"
                        multiple
                        class="ui-file-native"
                        onchange="actualizarNombreArchivosAsterOcr()"
                    >

                    <label for="asterOcrFiles" class="ui-file-browse">
                        📁 Seleccionar imagen
                    </label>

                    <span id="asterOcrFilesResumen" class="ui-file-name">
                        Ningún archivo seleccionado
                    </span>
                </div>

                <button type="button" class="ui-btn-success aster-main-action" onclick="subirOCRAster(this)">
                    Reconocer OCR ASTER
                </button>

                <div class="aster-help-text">
                    Si el OCR no reconoce bien, corrija el total manualmente en el paso 2.
                </div>
            </section>

            <section class="aster-step-card">
                <div class="aster-step-header">
                    <span class="aster-step-number">2</span>
                    <div>
                        <h4>Confirmar total general</h4>
                        <p>Ingrese o corrija el total antes de continuar.</p>
                    </div>
                </div>

                <div class="aster-total-confirm-row">
                    <label for="manualTotalAster" class="ui-mini-label">
                        Total general ASTER
                    </label>

                    <input
                        id="manualTotalAster"
                        type="number"
                        min="0"
                        placeholder="Ejemplo: 3266"
                        class="ui-input-120 aster-total-input"
                    >

                    <button type="button" class="ui-btn-blue-sm" onclick="consolidarTotalAster(this)">
                        Guardar total ASTER
                    </button>
                </div>
            </section>

            <section class="aster-result-card">
                <div class="aster-step-header">
                    <span class="aster-step-number result">3</span>
                    <div>
                        <h4>Resultado de captura</h4>
                        <p>Estado del total ASTER capturado para el proceso diario.</p>
                    </div>
                </div>

                <div id="aster-total-resultado" class="ui-result-block aster-result-content">
                    <div class="log-line warning">
                        ⚠️ Total ASTER pendiente de captura.
                    </div>
                </div>
            </section>
        </div>
    </div>
</details>

        <details class="panel-monitor aster-fase-b-panel">
    <summary>
        <span class="panel-icon">📁</span>
        FASE B. Ubicación y copia del archivo ASTER
    </summary>

    <div class="panel-body">
        <div class="aster-fase-bc-grid">
            <section class="aster-step-card">
                <div class="aster-step-header">
                    <span class="aster-step-number">1</span>
                    <div>
                        <h4>Parámetros de búsqueda</h4>
                        <p>Busque el archivo Excel del día con formato AfterYYYYMMDD.xlsx y cópielo a la carpeta local del proceso.</p>
                    </div>
                </div>

                <div class="aster-field-stack">
                    <label for="asterFechaProceso" class="ui-mini-label">
                        Fecha proceso
                    </label>

                    <input
                        id="asterFechaProceso"
                        type="text"
                        placeholder="Ejemplo: 20260513"
                        class="ui-input ui-input-md"
                        oninput="sincronizarFechaAster(this.value)"
                        onchange="sincronizarFechaAster(this.value)"
                    >
                </div>

                <div class="aster-field-stack">
                    <label for="asterRutaBase" class="ui-mini-label">
                        Ruta base opcional
                    </label>

                    <input
                        id="asterRutaBase"
                        type="text"
                        placeholder="Dejar vacío para usar rutas por defecto"
                        class="ui-input ui-input-lg"
                    >
                </div>

                <div class="aster-route-hint">
                    <span>Rutas por defecto:</span>
                    <code>Z:\COBRANZA %\...</code>
                    <code>\\10.24.90.118\COBRANZA %\...</code>
                </div>
            </section>

            <section class="aster-step-card">
                <div class="aster-step-header">
                    <span class="aster-step-number">2</span>
                    <div>
                        <h4>Ejecutar búsqueda y copia</h4>
                        <p>Ubica el archivo After del día, valida el nombre y lo copia a la carpeta diaria local.</p>
                    </div>
                </div>

                <button type="button" class="ui-btn-success aster-main-action" onclick="buscarYCopiarArchivoAster(this)">
                    Buscar y copiar archivo ASTER
                </button>

                <div class="aster-help-text">
                    Esta fase debe completarse antes de normalizar encabezados en Fase C.
                </div>
            </section>

            <section class="aster-result-card">
                <div class="aster-step-header">
                    <span class="aster-step-number result">3</span>
                    <div>
                        <h4>Resultado de archivo</h4>
                        <p>Estado de búsqueda, archivo encontrado, ruta origen y ruta destino.</p>
                    </div>
                </div>

                <div id="aster-archivo-resultado" class="ui-result-block aster-result-content">
                    <div class="log-line warning">
                        ⚠️ Archivo ASTER pendiente de búsqueda.
                    </div>
                </div>
            </section>
        </div>
    </div>
</details>

                <details class="panel-monitor aster-fase-c-panel">
    <summary>
        <span class="panel-icon">⚙️</span>
        FASE C. Normalización del Excel ASTER
    </summary>

        <div class="aster-fase-bc-grid">
            <section class="aster-step-card">

                    <span class="aster-step-number">1</span>

                        <p>La normalización trabaja sobre el archivo ASTER copiado en la Fase B.</p>
                    </div>
                </div>

                <div class="aster-checklist">
                    <div>✅ Quitar acentos</div>
                    <div>✅ Reemplazar espacios por guion bajo</div>
                    <div>✅ Reemplazar /, *, - por guion bajo</div>
                    <div>✅ Preparar encabezados para las siguientes fases</div>
                </div>
            </section>

            <section class="aster-step-card">
                <div class="aster-step-header">
                    <span class="aster-step-number">2</span>
                    <div>

            <section class="aster-result-card">

        </div>
    </div>

        <details class="panel-monitor aster-fase-d-panel">
    <summary>
        <span class="panel-icon">🧾</span>

    </summary>

                    <div>✅ Cuenta entidades únicas y registros por entidad</div>
                </div>
            </section>

            <section class="aster-step-card">
                <div class="aster-step-header">
                    <span class="aster-step-number">2</span>
                    <div>

            <section class="aster-result-card">

                <div id="aster-entidades-resultado" class="ui-result-block aster-result-content">
                    <div class="log-line warning">

                </div>
            </section>
        </div>
    </div>

                <details class="panel-monitor aster-fase-f-panel">

    <div class="panel-body">
        <div class="aster-fase-fg-grid">
            <section class="aster-step-card">
                <div class="aster-step-header">
                    <span class="aster-step-number">1</span>
                    <div>
                        <h4>Preparar depuración</h4>
                        <p>Parte de las entidades SQL obtenidas en Fase E para separar registros válidos y no válidos.</p>
                    </div>
                </div>

                <div class="aster-checklist">
                    <div>✅ Requiere consulta SQL ASTER ejecutada</div>
                    <div>✅ Usa entidades SQL por fecha</div>
                    <div>✅ Identifica entidades que no corresponden a cobranzas %</div>

                        <h4>Resultado de depuración y clasificación</h4>
                        <p>Registros removidos, seleccionados como Cobranza %, Integral y no seleccionados.</p>
                    </div>
                </div>

                <div id="aster-depuracion-resultado" class="ui-result-block aster-result-content">
                    <div class="log-line warning">
                        ⚠️ Depuración ASTER pendiente de ejecución.
                    </div>
                </div>

        </div>
    </div>
</details>

    </summary>

    <div class="panel-body">
        <div class="aster-fase-fg-grid">
            <section class="aster-step-card">
                <div class="aster-step-header">
                    <span class="aster-step-number">1</span>
                    <div>
                        <h4>Datos requeridos</h4>
