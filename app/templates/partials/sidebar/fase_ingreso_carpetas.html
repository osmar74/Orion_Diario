<details open>
    <summary>📁 Fase A/B: Ingreso y Carpetas</summary>

    <div class="fase-actions">
        <label>Fecha proceso:</label>
        <input
            type="text"
            id="fechaInput"
            placeholder="Ejemplo: 202605_21"
            oninput="sincronizarFechaOrionPanel(this.value)"
            onchange="sincronizarFechaOrionPanel(this.value)"
        >

        <div class="log-line info">

        </div>

        <button type="button" onclick="abrirWorkflowOrion('crear.carpetas'); return false;">
            Ir a Crear Carpetas
        </button>

        <button type="button" onclick="abrirWorkflowOrion('verificar.red'); return false;">
            Ir a Verificar Red
        </button>
    </div>
